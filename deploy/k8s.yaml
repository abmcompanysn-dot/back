  selector: { matchLabels: { app: notification-svc } }
  template:
    metadata: { labels: { app: notification-svc } }
    spec:
      containers:
        - name: svc
          image: ghcr.io/abmcompanysn-dot/backend-miad/notification-svc:latest
          ports: [{ containerPort: 8087 }]
          envFrom: [{ secretRef: { name: miad-env } }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8087 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: notification-svc, namespace: miad }
spec:
  selector: { app: notification-svc }
  ports: [{ port: 8087 }]
---
# Entrée unique — remplace Caddy en mode Compose.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miad-gateway
  namespace: miad
spec:
  rules:
    - host: api.miadmarket.com
      http:
        paths:
          - { path: /products, pathType: Prefix, backend: { service: { name: catalog-svc, port: { number: 8081 } } } }
          - { path: /categories, pathType: Prefix, backend: { service: { name: catalog-svc, port: { number: 8081 } } } }
          - { path: /search, pathType: Prefix, backend: { service: { name: catalog-svc, port: { number: 8081 } } } }
          - { path: /stores, pathType: Prefix, backend: { service: { name: vendor-svc, port: { number: 8082 } } } }
          - { path: /vendor, pathType: Prefix, backend: { service: { name: vendor-svc, port: { number: 8082 } } } }
          - { path: /orders, pathType: Prefix, backend: { service: { name: order-svc, port: { number: 8083 } } } }
          - { path: /payments, pathType: Prefix, backend: { service: { name: payment-svc, port: { number: 8084 } } } }
          - { path: /shipping-rates, pathType: Prefix, backend: { service: { name: shipping-svc, port: { number: 8085 } } } }
          - { path: /auth, pathType: Prefix, backend: { service: { name: auth-svc, port: { number: 8086 } } } }
          - { path: /customer, pathType: Prefix, backend: { service: { name: auth-svc, port: { number: 8086 } } } }
