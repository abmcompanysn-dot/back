---
apiVersion: v1
kind: Service
metadata: { name: payment-svc, namespace: miad }
spec:
  selector: { app: payment-svc }
  ports: [{ port: 8084 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: shipping-svc, namespace: miad }
spec:
  replicas: 1
  selector: { matchLabels: { app: shipping-svc } }
  template:
    metadata: { labels: { app: shipping-svc } }
    spec:
      containers:
        - name: svc
