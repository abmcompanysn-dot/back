            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /system-check, port: 8083 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: order-svc, namespace: miad }
spec:
  selector: { app: order-svc }
  ports: [{ port: 8083 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-svc, namespace: miad }
spec:
  replicas: 2
