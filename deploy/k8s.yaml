# ============================================================
# MIAD Market — manifests Kubernetes (k3s ou K8s managé)
#
# À utiliser QUAND le signal de bascule est atteint
# (déploiements sans coupure, multi-nœuds, autoscaling).
# Aujourd'hui : docker compose sur VPS — voir README.
#
# Les services applicatifs sont stateless : toute la config passe
# par le Secret ci-dessous. Postgres/Kafka/Redis ne sont PAS dans
# ce fichier — les recommander managés (ou StatefulSets dédiés
# avec volumes persistants, jamais en éphémère).
#
#   kubectl create secret generic miad-env --from-env-file=.env
#   kubectl apply -f deploy/k8s.yaml
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: miad
---
# Les 7 services partagent la même forme — un Deployment + un Service chacun.
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-svc, namespace: miad }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog-svc } }
  template:
    metadata: { labels: { app: catalog-svc } }
    spec:
      containers:
        - name: svc
          image: ghcr.io/abmcompanysn-dot/backend-miad/catalog-svc:latest
          ports: [{ containerPort: 8081 }]
          envFrom: [{ secretRef: { name: miad-env } }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /system-check, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: catalog-svc, namespace: miad }
spec:
  selector: { app: catalog-svc }
  ports: [{ port: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: vendor-svc, namespace: miad }
spec:
  replicas: 2
  selector: { matchLabels: { app: vendor-svc } }
  template:
    metadata: { labels: { app: vendor-svc } }
    spec:
      containers:
        - name: svc
          image: ghcr.io/abmcompanysn-dot/backend-miad/vendor-svc:latest
          ports: [{ containerPort: 8082 }]
          envFrom: [{ secretRef: { name: miad-env } }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /system-check, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: vendor-svc, namespace: miad }
spec:
  selector: { app: vendor-svc }
  ports: [{ port: 8082 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-svc, namespace: miad }
spec:
  replicas: 2
  selector: { matchLabels: { app: order-svc } }
  template:
    metadata: { labels: { app: order-svc } }
