# ============================================================
# Passerelle Caddy — même Caddyfile que docker-compose (monté
# depuis le ConfigMap créé par le bootstrap : source unique).
# Service LoadBalancer : sur k3s, expose 80/443 sur le nœud.
# C'est l'URL que pointera app/api/* du frontend Next.js.
#
# /data en PersistentVolumeClaim (PAS emptyDir) : Caddy y stocke les
# certificats Let's Encrypt (HTTPS automatique sur origin.miadmarket.ca
# et kante.miadmarket.ca) — un emptyDir perdrait ces certificats à
# chaque redémarrage du pod, forçant une nouvelle demande à chaque
# fois. Let's Encrypt limite le nombre de certificats délivrés par
# domaine par semaine ; perdre le volume à répétition finit par
# bloquer le renouvellement.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: miad
spec:
  replicas: 1
  selector:
    matchLabels: { app: caddy }
  template:
    metadata:
      labels: { app: caddy }
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            # Relevé de 300m à 1000m le 2026-08-27 : la page d'accueil charge
            # 270+ images en une fois (grille catégories + "découvrir plus"),
            # toutes en passant par Caddy vers MinIO — sous cette charge,
            # certaines requêtes restaient "pending" indéfiniment côté
            # navigateur (jamais 200 ni erreur propre), déclenchant le
            # fallback gris de LazyImage.tsx (logo MIAD en transparence)
            # pour ~30% des cartes produit. Reproduit et confirmé en
            # navigation réelle avant ce changement.
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: caddyfile
          configMap: { name: caddyfile }
        - name: data
          persistentVolumeClaim: { claimName: caddy-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: miad
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: miad
spec:
  type: LoadBalancer
  selector: { app: caddy }
  ports:
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
