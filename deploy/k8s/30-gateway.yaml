# ============================================================
# Passerelle Caddy — même Caddyfile que docker-compose (monté
# depuis le ConfigMap créé par le bootstrap : source unique).
# Service LoadBalancer : sur k3s, expose 80/443 sur le nœud.
# C'est l'URL que pointera app/api/* du frontend Next.js.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: miad
spec:
  replicas: 1
  selector:
    matchLabels: { app: caddy }
  template:
    metadata:
      labels: { app: caddy }
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
      volumes:
        - name: caddyfile
          configMap: { name: caddyfile }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: miad
spec:
  type: LoadBalancer
  selector: { app: caddy }
  ports:
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
