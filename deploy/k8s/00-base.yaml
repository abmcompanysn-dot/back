# ============================================================
# MIAD Market — base Kubernetes (k3s sur VPS)
# Namespace + ConfigMap (valeurs non sensibles) + gabarit Secret.
# Le VRAI Secret est créé par scripts/vps-bootstrap.sh depuis le
# .env du VPS — jamais de valeurs réelles committées ici.
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: miad
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: miad-config
  namespace: miad
data:
  # Adresses internes au cluster — mêmes noms que docker-compose,
  # donc le même .env.example fonctionne dans les deux modes.
  #
  # PGHOST/PGPORT/PGUSER retirés le 2026-08-24 : ce ne sont PAS de simples
  # valeurs documentaires — pgx (client Postgres utilisé par tous les
  # services Go) applique automatiquement les variables d'environnement
  # libpq standard (PGHOST/PGPORT/PGUSER/PGPASSWORD) PAR-DESSUS le DSN
  # explicite passé à pgxpool.ParseConfig(), même quand ce DSN vient
  # d'ailleurs (ici DATABASE_URL_CATALOG et consorts). Avec PGUSER/PGHOST
  # présents mais PGPASSWORD absent, la connexion tente une authentification
  # sans mot de passe utilisable et échoue TOUJOURS ("password authentication
  # failed"), même avec un DATABASE_URL_* parfaitement correct — confirmé en
  # diagnostiquant un échec de connexion catalog-svc après rollout : le
  # mot de passe Postgres réel était bon (vérifié par connexion psql directe
  # avec authentification scram-sha-256 réussie), mais catalog-svc échouait
  # quand même. Aucun service ne lit PGHOST/PGPORT/PGUSER individuellement
  # (chaque service lit uniquement son DATABASE_URL_<service> complet) :
  # ces 3 clés n'avaient donc aucune utilité et ne faisaient que casser
  # l'auth pgx en silence à chaque redémarrage de pod.
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  PORT_CATALOG: "8081"
  PORT_VENDOR: "8082"
  PORT_ORDER: "8083"
  PORT_PAYMENT: "8084"
  PORT_SHIPPING: "8085"
  PORT_AUTH: "8086"
  PORT_NOTIFICATION: "8087"
  PORT_ADMIN: "8088"
  CATALOG_SVC_URL: http://catalog-svc
  VENDOR_SVC_URL: http://vendor-svc
  ORDER_SVC_URL: http://order-svc
  PAYMENT_SVC_URL: http://payment-svc
  SHIPPING_SVC_URL: http://shipping-svc
  AUTH_SVC_URL: http://auth-svc
  NOTIFICATION_SVC_URL: http://notification-svc
  ADMIN_SVC_URL: http://admin-svc
  PAYMENT_TIMEOUT_MINUTES: "30"
  OTP_TTL_MINUTES: "5"
  JWT_TTL_HOURS: "72"
  # Stockage objet des images (MinIO, voir 10-infra.yaml) — servi en HTTPS
  # sur son propre domaine img.miadmarket.ca (proxy Caddy vers minio:9000,
  # voir deploy/Caddyfile), jamais exposé directement par IP:9000 en clair.
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "miad-media"
  MEDIA_BASE_URL: "https://img.miadmarket.ca"
---
# GABARIT DOCUMENTÉ — écrasé par le bootstrap :
#   kubectl -n miad create secret generic miad-secrets \
#     --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: miad-secrets
  namespace: miad
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE-MOI-SUR-LE-VPS
  DATABASE_URL_CATALOG: postgres://miad:CHANGE-MOI@postgres:5432/miad_catalog?sslmode=disable
  DATABASE_URL_VENDOR: postgres://miad:CHANGE-MOI@postgres:5432/miad_vendor?sslmode=disable
  DATABASE_URL_ORDER: postgres://miad:CHANGE-MOI@postgres:5432/miad_order?sslmode=disable
  DATABASE_URL_PAYMENT: postgres://miad:CHANGE-MOI@postgres:5432/miad_payment?sslmode=disable
  DATABASE_URL_SHIPPING: postgres://miad:CHANGE-MOI@postgres:5432/miad_shipping?sslmode=disable
  DATABASE_URL_AUTH: postgres://miad:CHANGE-MOI@postgres:5432/miad_auth?sslmode=disable
  DATABASE_URL_NOTIFICATION: postgres://miad:CHANGE-MOI@postgres:5432/miad_notification?sslmode=disable
  JWT_SECRET: CHANGE-MOI-SUR-LE-VPS
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
  REDIS_PASSWORD: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  PAYDUNYA_MASTER_KEY: ""
  PAYDUNYA_API_KEY_PUBLIC: ""
  PAYDUNYA_API_KEY_PRIVATE: ""
  FIREBASE_WEB_CLIENT_ID: ""
  STOREFRONT_URL: ""
  SMS_PROVIDER_URL: ""
  MINIO_ROOT_USER: CHANGE-MOI-SUR-LE-VPS
  MINIO_ROOT_PASSWORD: CHANGE-MOI-SUR-LE-VPS
