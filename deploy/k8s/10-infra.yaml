# ============================================================
# Infra dans le cluster : Postgres (8 bases), Redis, Kafka KRaft.
# Volumes : local-path (fourni par k3s). En prod chargée, passer
# Postgres/Kafka/Redis en managé et supprimer ce fichier.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-initdb
  namespace: miad
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    for db in miad_catalog miad_vendor miad_order miad_payment miad_shipping miad_auth miad_notification miad_admin; do
      echo "-> creation de la base $db"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        CREATE DATABASE $db OWNER $POSTGRES_USER;
    EOSQL
    done
    echo "-> 8 bases prêtes."
    # ATTENTION : ce script ne s'exécute qu'au TOUT PREMIER démarrage du
    # volume Postgres (docker-entrypoint-initdb.d) — sur un cluster déjà
    # initialisé, ajouter une base ici n'a aucun effet rétroactif. Créer
    # miad_admin manuellement (CREATE DATABASE miad_admin OWNER miad;) sur
    # un cluster existant lors de l'ajout d'admin-svc (2026-08-24).
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: miad
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: miad
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: miad-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "miad"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: initdb
          configMap: { name: pg-initdb, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: miad
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: miad
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 320Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: miad
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: miad
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          # bitnami/kafka retiré du registre gratuit Docker Hub (accès
          # "Bitnami Secure Images" désormais payant, tags versionnés
          # disparus mi-2025 — même `latest` renvoie 404 en anonyme,
          # confirmé le 2026-08-24). Remplacé par l'image officielle
          # Apache Kafka (KRaft natif, pas de préfixe CFG_ sur les
          # variables d'environnement, format différent de Bitnami).
          image: apache/kafka:3.8.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: CLUSTER_ID, value: "miad-kafka-cluster-1" }
          ports:
            - containerPort: 9092
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: miad
spec:
  # headless (clusterIP: None) : le broker ET le controller (même pod,
  # rôle combiné KRaft) doivent se joindre via kafka:9093 — un Service
  # ClusterIP classique n'exposant que 9092 laisse le port controller
  # injoignable et le broker boucle indéfiniment sur "Unable to register
  # the broker because the RPC got timed out" (confirmé le 2026-08-24).
  clusterIP: None
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }
    - { name: controller, port: 9093, targetPort: 9093 }
---
# ============================================================
# MinIO — stockage objet S3-compatible pour les images produits/
# vendeurs. Le bucket "miad-media" est servi en HTTPS via Caddy
# (origin.miadmarket.ca/media/* → proxy vers minio:9000, voir
# deploy/Caddyfile) : jamais d'accès direct par IP:9000 en clair.
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: miad
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: miad-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: miad-secrets, key: MINIO_ROOT_PASSWORD }
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            # Relevé de 500m à 1000m le 2026-08-27, en même temps que Caddy
            # (deploy/k8s/30-gateway.yaml) — voir le commentaire là-bas pour
            # le diagnostic complet (images produit grises sous charge sur
            # l'accueil, requêtes "pending" jamais résolues côté navigateur).
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: miad
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# Job unique : crée le bucket miad-media et le passe en lecture
# publique anonyme (nécessaire pour que Caddy serve les images sans
# authentification — écriture/suppression restent protégées par les
# clés MINIO_ROOT_USER/PASSWORD, jamais exposées côté client).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: miad
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: miad-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: miad-secrets, key: MINIO_ROOT_PASSWORD }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing local/miad-media
              mc anonymous set download local/miad-media
              echo "bucket miad-media prêt (lecture publique)."
