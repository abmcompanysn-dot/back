# ============================================================
# Les 7 services métier.
# Images construites sur le VPS puis importées dans containerd
# (imagePullPolicy: Never — pas de registry nécessaire).
# Pour scaler : kubectl -n miad scale deploy/catalog-svc --replicas=3
# (les services sont stateless ; HPA possible en ajoutant des probes CPU)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-svc, namespace: miad }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog-svc } }
  template:
    metadata: { labels: { app: catalog-svc } }
    spec:
      containers:
        - name: svc
          image: miad/catalog-svc:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: miad-config }
            - secretRef: { name: miad-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: catalog-svc, namespace: miad }
spec:
  selector: { app: catalog-svc }
  ports: [{ port: 80, targetPort: 8081 }]
---
