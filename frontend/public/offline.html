<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIAD Market - Connexion perdue</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #ffffff; color: #1a1a1a; text-align: center; padding: 24px; }
        .container { max-width: 400px; }
        .logo { width: 100px; height: auto; margin-bottom: 32px; filter: grayscale(1); opacity: 0.7; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; }
        p { color: #666; line-height: 1.6; margin-bottom: 24px; }
        .people-box { background: #fff7ed; border: 1px solid #ffedd5; padding: 16px; border-radius: 12px; margin-bottom: 32px; }
        .people-text { color: #9a3412; font-size: 0.9rem; font-weight: 500; }
        .retry-btn { background: #000; color: #fff; border: none; padding: 12px 32px; border-radius: 100px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .retry-btn:disabled { background: #ccc; cursor: not-allowed; }
        .dot { display: inline-block; width: 8px; height: 8px; background: #ff9900; border-radius: 50%; animation: pulse 1.5s infinite; margin-right: 8px; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div class="container">
        <img src="/logo/logo.png" alt="MIAD" class="logo" crossorigin="anonymous" loading="eager">
        <h1>Plus de réseau ?</h1>
        <p>On dirait que la connexion fait des siennes. Ne bougez pas, MIAD Market essaie de vous reconnecter.</p>
        
        <div class="people-box">
            <div class="people-text">
                <span class="dot"></span>
                Vos vendeurs et la communauté MIAD autour de vous n'attendent que votre retour !
            </div>
        </div>

        <button id="retry-btn" class="retry-btn" onclick="checkConnection()">Réessayer</button>
    </div>
    <script>
        async function checkConnection() {
            const btn = document.getElementById('retry-btn');
            btn.disabled = true;
            btn.textContent = "Vérification...";
            
            try {
                // Tente de charger une ressource légère et non-mise en cache pour vérifier la connexion
                await fetch('/logo/logo.png', { mode: 'no-cors', cache: 'no-store' });
                window.location.reload();
            } catch (e) {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = "Réessayer";
                }, 1000);
            }
        }
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
