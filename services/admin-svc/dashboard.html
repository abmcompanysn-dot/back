<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MIAD Market — Administration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #111; }
  header { background: #005826; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; }
  nav { display: flex; gap: 4px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  nav button { border: none; background: transparent; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  nav button.active { background: #005826; color: #fff; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card .num { font-size: 26px; font-weight: 700; }
  .card .label { font-size: 12px; color: #666; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 13px; }
  th { background: #fafafa; }
  #login { max-width: 360px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 8px; }
  #login input { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; }
  #login button { width: 100%; padding: 10px; background: #005826; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 8px; }
  .status-ok { color: #0a7a2f; } .status-down { color: #c02020; }
  .hidden { display: none; }
  pre { background: #fff; padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>

<div id="login">
  <h2>Connexion admin</h2>
  <input id="email" placeholder="email" type="email">
  <input id="password" placeholder="mot de passe" type="password">
  <button onclick="login()">Se connecter</button>
  <p id="login-error" style="color:#c02020;font-size:13px"></p>
</div>

<div id="app" class="hidden">
  <header>
    <h1>MIAD Market — Administration</h1>
    <button onclick="logout()" style="background:transparent;border:1px solid #fff;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer">Déconnexion</button>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>

<script>
const TABS = ["Vue d'ensemble","Commandes","Produits","Boutiques","Clients","Paiements","Livraison","Système"];
let current = TABS[0];

function token() { return localStorage.getItem('miad_admin_jwt') || ''; }
function setToken(t) { localStorage.setItem('miad_admin_jwt', t); }
function clearToken() { localStorage.removeItem('miad_admin_jwt'); }

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/auth/admin/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error?.message || 'échec de connexion');
    setToken(body.session.jwt);
    showApp();
  } catch (e) {
    document.getElementById('login-error').textContent = e.message;
  }
}

function logout() { clearToken(); location.reload(); }

function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderNav();
  renderView(current);
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t;
    b.className = t === current ? 'active' : '';
    b.onclick = () => { current = t; renderNav(); renderView(t); };
    nav.appendChild(b);
  });
}

async function api(path) {
  const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token() } });
  if (res.status === 403) { clearToken(); location.reload(); throw new Error('session expirée'); }
  const body = await res.json();
  if (!res.ok) throw new Error(body.error?.message || 'erreur API');
  return body;
}

function table(items, cols) {
  if (!items || !items.length) return '<p>Aucune donnée.</p>';
  let html = '<table><thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
  for (const row of items) {
    html += '<tr>' + cols.map(c => `<td>${row[c] ?? ''}</td>`).join('') + '</tr>';
  }
  return html + '</tbody></table>';
}

async function renderView(tab) {
  const view = document.getElementById('view');
  view.innerHTML = '<p>Chargement…</p>';
  try {
    if (tab === "Vue d'ensemble") {
      const o = await api('/admin/api/overview');
      view.innerHTML = `
        <div class="cards">
          <div class="card"><div class="num">${o.orders_total ?? '—'}</div><div class="label">Commandes</div></div>
          <div class="card"><div class="num">${o.products_total ?? '—'}</div><div class="label">Produits</div></div>
          <div class="card"><div class="num">${o.vendors_total ?? '—'}</div><div class="label">Boutiques</div></div>
          <div class="card"><div class="num">${o.payments_total ?? '—'}</div><div class="label">Paiements</div></div>
        </div>
        <h3>État des services</h3>
        <table><tbody>${Object.entries(o.services||{}).map(([k,v]) =>
          `<tr><td>${k}</td><td class="status-${v}">${v}</td></tr>`).join('')}</tbody></table>`;
    } else if (tab === 'Commandes') {
      const d = await api('/admin/api/orders');
      view.innerHTML = table(d.items, ['id','reference','vendor_id','status','total_usd','created_at']);
    } else if (tab === 'Produits') {
      const d = await api('/admin/api/products');
      view.innerHTML = table(d.items, ['id','name','vendor_id','price','lang']);
    } else if (tab === 'Boutiques') {
      const d = await api('/admin/api/vendors');
      view.innerHTML = table(d.items, ['id','name','country','city','rating_avg','product_count']);
    } else if (tab === 'Clients') {
      const d = await api('/admin/api/customers');
      view.innerHTML = table(d.items, ['id','email','phone','preferred_lang','created_at']);
    } else if (tab === 'Paiements') {
      const d = await api('/admin/api/payments');
      view.innerHTML = table(d.items, ['id','order_id','provider','status','amount_usd','created_at']);
    } else if (tab === 'Livraison') {
      view.innerHTML = `
        <p>Devis interactif — zone internationale (POST vers shipping-svc à intégrer ici).</p>
        <div id="quote-result"></div>`;
    } else if (tab === 'Système') {
      const d = await api('/admin/api/system');
      view.innerHTML = `<p>Statut global : <b class="status-${d.status === 'ok' ? 'ok' : 'down'}">${d.status}</b></p>
        <pre>${JSON.stringify(d.services, null, 2)}</pre>`;
    }
  } catch (e) {
    view.innerHTML = `<p style="color:#c02020">Erreur : ${e.message}</p>`;
  }
}

if (token()) { showApp(); }
</script>
</body>
</html>
